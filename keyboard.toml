[keyboard]
name = "ESP32S3 Keyboard"
product_name = "ESP32S3 Keyboard"
vendor_id = 0x4c4b
product_id = 0x4643
manufacturer = "haobo"
serial_number = "vial:f64c2b3c:000001"
chip = "esp32s3"
usb_enable = true

[matrix]
matrix_type = "normal"
row_pins = ["GPIO1", "GPIO2", "GPIO3"]
col_pins = ["GPIO5", "GPIO6", "GPIO7"]
row2col = true

[layout]
rows = 3
cols = 3
map = """
(0,0) (0,1) (0,2)
(1,0) (1,1) (1,2)
(2,0) (2,1) (2,2)
"""

[keymap]
layers = 2

[[keymap.layer]]
keys = """
Kp7             Kp8          Kp9
Kp4             Kp5          Kp6
Kp1             Kp2          MO(1)
"""

[[keymap.layer]]
keys = """
MediaPlayPause  AudioVolUp   MediaNextTrack
AudioMute       AudioVolDown MediaPrevTrack
_               _            MO(1)
"""


[ble]
enabled = true

[storage]
enabled = true
# 0x3d0000 is a standard safe sector offset in 4MB flash for user config data.
start_addr = 0x3d0000
num_sectors = 16
clear_storage = false

[event]
layer_change.subs = 2

[display]
driver = "ssd1306"
size = "128x64"
rotation = 0
renderer = "OledRenderer"
min_render_interval = 10

[display.protocol.i2c]
instance = "I2C0"
scl = "GPIO9"
sda = "GPIO10"
address = 0x3c

